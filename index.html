<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Yard Tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow column built for a phone in a truck cab. Sticky header and module tabs, ticket cards that expand in place, a fixed "New ticket" bar at the bottom. */
:root {
  --bg: #e8ebe5;
  --card: #f6f7f3;
  --ink: #18211c;
  --muted: #5a665e;
  --line: #cbd1c7;
  --accent: #1b6a4e;
  --accent-ink: #ffffff;
  --crit: #b3261e;
  --warn: #9a5b00;
  --info: #1f5fa8;
  --ok: #2c7a38;
  --vio: #6446b0;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111713; --card: #1a221d; --ink: #e7ede8; --muted: #98a59c; --line: #2b3731;
    --accent: #5cc59a; --accent-ink: #0b1a12; --crit: #ff8a80; --warn: #f0b35a; --info: #8bb8f0;
    --ok: #7fd18a; --vio: #b9a6f2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111713; --card: #1a221d; --ink: #e7ede8; --muted: #98a59c; --line: #2b3731;
  --accent: #5cc59a; --accent-ink: #0b1a12; --crit: #ff8a80; --warn: #f0b35a; --info: #8bb8f0;
  --ok: #7fd18a; --vio: #b9a6f2; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; }
* { box-sizing: border-box; }
.disp { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; }
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.tab { flex: 1; min-width: 0; padding: 10px 6px 9px; border-bottom: 4px solid transparent; color: var(--muted); text-align: center; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; font-size: 17px; line-height: 1.1; background: none; border-top: 0; border-left: 0; border-right: 0; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { display: inline-block; margin-left: 4px; min-width: 22px; padding: 1px 6px; border-radius: 99px; background: var(--line); color: var(--ink); font-size: 14px; }
.tab[aria-selected="true"] .n { background: var(--accent); color: var(--accent-ink); }
.chip { flex: none; padding: 7px 13px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; }
.stripe { width: 6px; flex: none; background: var(--c, var(--line)); }
.pill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); white-space: nowrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .55; cursor: default; }
.fld { width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 16px; }
textarea.fld { min-height: 96px; resize: vertical; }
.lbl { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--bg) 92%, transparent); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); backdrop-filter: blur(6px); }
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
.err { padding: 10px 12px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--crit) 45%, transparent); background: color-mix(in srgb, var(--crit) 10%, transparent); color: var(--crit); font-size: 15px; overflow-wrap: anywhere; }
.scroll-x { display: flex; gap: 8px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="root"></div>

<script>
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);

/* ---------- Supabase settings ---------- */
const SB_URL = "https://odthhfckgkozetzcbglg.supabase.co";
const SB_KEY = "sb_publishable_rmo6F4vWE0fJARhrElXshw_mRCjRzch";
const ALLOW_SIGNUP = false; // false: only people you invite in Supabase can sign in by magic link

/* ---------- Domain ---------- */
const MODULES = {
  ordering: { label: "Client Ordering", short: "Ordering", types: ["Pickup request", "Bulk collection", "Bin or container drop-off", "Quote request", "Missed collection", "Complaint"] },
  maintenance: { label: "Maintenance", short: "Maintenance", types: ["Truck repair", "Baler or shredder fault", "Weighbridge or scale", "Bin or container damage", "Yard or building repair", "Scheduled service"] },
  internal: { label: "Internal Services", short: "Internal", types: ["Driver issue", "Supplies request", "Safety incident", "Payroll or admin", "IT help", "Other"] },
};
const STATUSES = ["new", "assigned", "in_progress", "done", "closed"];
const STATUS = {
  new: { label: "New", c: "var(--info)" },
  assigned: { label: "Assigned", c: "var(--vio)" },
  in_progress: { label: "In Progress", c: "var(--warn)" },
  done: { label: "Done", c: "var(--ok)" },
  closed: { label: "Closed", c: "var(--muted)" },
};
const PRIORITIES = ["low", "normal", "high", "urgent"];
const PRIORITY = {
  low: { label: "Low", c: "var(--muted)", w: 0 },
  normal: { label: "Normal", c: "var(--info)", w: 1 },
  high: { label: "High", c: "var(--warn)", w: 2 },
  urgent: { label: "Urgent", c: "var(--crit)", w: 3 },
};
const FILTERS = [["active", "Active"], ["new", "New"], ["assigned", "Assigned"], ["in_progress", "In Progress"], ["done", "Done"], ["closed", "Closed"], ["all", "All"]];

const fmtNo = (n) => (n == null ? "TKT-…" : "TKT-" + String(n).padStart(4, "0"));
function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}
const LS = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
function normalize(r) {
  return {
    id: r.id, ticket_number: r.ticket_number, module: r.module, type: r.type, title: r.title || "",
    description: r.description || "", address: r.address || "", photo_url: r.photo_url || null,
    has_photo: !!(r.photo_url || r.has_photo), status: r.status || "new", priority: r.priority || "normal",
    created_by_email: r.created_by_email || "", created_at: r.created_at, updated_at: r.updated_at,
  };
}
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? res(b) : rej(new Error("Could not read that photo"))), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Could not read that photo")); };
    img.src = url;
  });
}
const toDataUrl = (b) => new Promise((r) => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const errText = (e) => (e && (e.message || e.error_description || e.code)) || "Something went wrong";

/* ---------- Backend 1: your Supabase project ---------- */
function supabaseBackend() {
  const sb = window.supabase.createClient(SB_URL, SB_KEY);
  const asUser = (s) => (s ? { id: s.user.id, name: s.user.email } : null);
  let loader = null;
  return {
    mode: "supabase", label: "Supabase", canSignOut: true,
    async init() { const { data } = await sb.auth.getSession(); return asUser(data.session); },
    onAuth(cb) { const { data } = sb.auth.onAuthStateChange((_e, s) => cb(asUser(s))); return () => data.subscription.unsubscribe(); },
    async signIn(email) {
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: ALLOW_SIGNUP, emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
    },
    signOut() { return sb.auth.signOut(); },
    subscribe(cb, onErr) {
      let dead = false;
      loader = async () => {
        const { data, error } = await sb.from("tickets").select("*").order("created_at", { ascending: false }).limit(500);
        if (dead) return;
        if (error) onErr(error); else cb(data.map(normalize));
      };
      loader();
      const ch = sb.channel("tickets-feed").on("postgres_changes", { event: "*", schema: "public", table: "tickets" }, () => loader()).subscribe();
      return { refresh: () => loader && loader(), stop() { dead = true; sb.removeChannel(ch); } };
    },
    async create(t, file, user) {
      let photo_url = null;
      if (file) {
        const blob = await shrink(file, 1280, 0.8);
        const path = user.id + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
        const up = await sb.storage.from("ticket-photos").upload(path, blob, { contentType: "image/jpeg" });
        if (up.error) throw up.error;
        photo_url = sb.storage.from("ticket-photos").getPublicUrl(path).data.publicUrl;
      }
      const { error } = await sb.from("tickets").insert({ ...t, photo_url, created_by: user.id, created_by_email: user.name });
      if (error) throw error;
    },
    async setStatus(id, status) {
      const { error } = await sb.from("tickets").update({ status, updated_at: new Date().toISOString() }).eq("id", id);
      if (error) throw error;
    },
    async getPhoto(t) { return t.photo_url; },
  };
}

/* ---------- Backend 2: the artifact's own data store (used inside Claude) ---------- */
function artifactBackend(db, userCap) {
  const col = db.collection("tickets");
  return {
    mode: "artifact", label: "Claude data store (preview)", canSignOut: false,
    async init() {
      let id = "viewer", name = "You";
      try { if (userCap) { id = (await userCap.id()) || id; const me = await userCap.me(); name = (me && me.name) || name; } } catch (e) {}
      return { id, name };
    },
    onAuth() { return () => {}; },
    subscribe(cb, onErr) {
      const un = col.onSnapshot((s) => cb(s.docs.map((d) => normalize({ id: d.id, ...d.data() }))), onErr);
      return { refresh() {}, stop: un };
    },
    async create(t, file, user, nextNo) {
      const ref = col.doc();
      if (file) {
        const blob = await shrink(file, 800, 0.7);
        await db.doc("photos/" + ref.id).set({ url: await toDataUrl(blob) });
      }
      const now = new Date().toISOString();
      await ref.set({ ...t, ticket_number: nextNo, has_photo: !!file, created_by_email: user.name, created_at: now, updated_at: now });
    },
    async setStatus(id, status) { await col.doc(id).update({ status, updated_at: new Date().toISOString() }); },
    async getPhoto(t) { const s = await db.doc("photos/" + t.id).get(); return s.exists ? s.data().url : null; },
  };
}

async function makeBackend() {
  const inClaude = !!(window.claude && window.claude.use);
  if (inClaude) {
    let db = null, userCap = null;
    try { db = await claude.use("db"); } catch (e) {}
    try { userCap = await claude.use("user"); } catch (e) {}
    if (db) return artifactBackend(db, userCap);
    return { mode: "none" };
  }
  if (!window.supabase) return { mode: "none", reason: "The Supabase library did not load. Check your connection and reload." };
  return supabaseBackend();
}

/* ---------- UI ---------- */
function Pill({ c, children }) { return html`<span class="pill" style=${{ "--c": c }}>${children}</span>`; }

function Login({ be }) {
  const [email, setEmail] = useState("");
  const [busy, setBusy] = useState(false);
  const [sent, setSent] = useState(false);
  const [err, setErr] = useState("");
  async function go(e) {
    e.preventDefault(); setBusy(true); setErr("");
    try { await be.signIn(email.trim()); setSent(true); } catch (x) { setErr(errText(x)); }
    setBusy(false);
  }
  return html`<div class="wrap" style=${{ paddingBlock: "12vh 32px" }}>
    <div class="disp" style=${{ fontSize: 44, lineHeight: 1 }}>Yard Tickets</div>
    <p style=${{ color: "var(--muted)", margin: "8px 0 28px" }}>Orders, repairs and internal requests in one place.</p>
    ${sent
      ? html`<div class="card"><div class="stripe" style=${{ "--c": "var(--ok)" }}></div><div style=${{ padding: 16 }}>
          <div class="disp" style=${{ fontSize: 22 }}>Check your email</div>
          <p style=${{ margin: "6px 0 0" }}>We sent a sign-in link to <b>${email}</b>. Open it on this phone.</p></div></div>`
      : html`<form onSubmit=${go} class="flex flex-col gap-4">
          <div><label class="lbl" for="email">Work email</label>
            <input id="email" class="fld" type="email" inputmode="email" autocomplete="email" required placeholder="name@company.com" value=${email} onInput=${(e) => setEmail(e.target.value)} /></div>
          ${err && html`<div class="err">${err}</div>`}
          <button class="btn" disabled=${busy || !email}>${busy ? "Sending…" : "Email me a sign-in link"}</button>
          <p style=${{ color: "var(--muted)", fontSize: 14, margin: 0 }}>No password. Only invited staff and drivers can sign in.</p>
        </form>`}
  </div>`;
}

function Photo({ t, be }) {
  const [url, setUrl] = useState(null);
  useEffect(() => { let on = true; if (t.has_photo) be.getPhoto(t).then((u) => on && setUrl(u)).catch(() => {}); return () => { on = false; }; }, [t.id]);
  if (!t.has_photo) return null;
  return url
    ? html`<img src=${url} alt="Photo attached to ${fmtNo(t.ticket_number)}" style=${{ width: "100%", maxHeight: 360, objectFit: "cover", borderRadius: 6, border: "1px solid var(--line)" }} />`
    : html`<div style=${{ height: 80, borderRadius: 6, border: "1px dashed var(--line)", display: "grid", placeItems: "center", color: "var(--muted)", fontSize: 14 }}>Loading photo…</div>`;
}

function Ticket({ t, be, open, onToggle, onStatus }) {
  const st = STATUS[t.status] || STATUS.new;
  const pr = PRIORITY[t.priority] || PRIORITY.normal;
  const idx = STATUSES.indexOf(t.status);
  const next = idx >= 0 && idx < STATUSES.length - 1 ? STATUSES[idx + 1] : null;
  return html`<article class="card" style=${{ opacity: t.status === "closed" ? 0.72 : 1 }}>
    <div class="stripe" style=${{ "--c": pr.c }}></div>
    <div style=${{ flex: 1, minWidth: 0 }}>
      <button onClick=${onToggle} aria-expanded=${open} style=${{ display: "block", width: "100%", textAlign: "left", background: "none", border: 0, color: "inherit", font: "inherit", padding: "12px 14px", cursor: "pointer" }}>
        <div class="flex items-center gap-2 flex-wrap">
          <span class="mono" style=${{ fontSize: 14, color: "var(--muted)" }}>${fmtNo(t.ticket_number)}</span>
          <${Pill} c=${st.c}>${st.label}<//>
          <${Pill} c=${pr.c}>${pr.label}<//>
        </div>
        <div style=${{ fontWeight: 600, fontSize: 18, margin: "6px 0 2px", overflowWrap: "anywhere" }}>${t.title}</div>
        <div style=${{ color: "var(--muted)", fontSize: 14, overflowWrap: "anywhere" }}>${t.type}${t.address ? " · " + t.address : ""} · ${ago(t.created_at)}</div>
      </button>
      ${open && html`<div class="flex flex-col gap-3" style=${{ padding: "0 14px 14px" }}>
        ${t.description && html`<p style=${{ margin: 0, whiteSpace: "pre-wrap", overflowWrap: "anywhere" }}>${t.description}</p>`}
        ${t.address && html`<a href=${"https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(t.address)} target="_blank" rel="noopener" style=${{ color: "var(--accent)", fontWeight: 600, overflowWrap: "anywhere" }}>Open address in Maps ↗</a>`}
        <${Photo} t=${t} be=${be} />
        <div style=${{ color: "var(--muted)", fontSize: 13 }}>Logged by ${t.created_by_email || "unknown"}</div>
        <div class="flex gap-2 flex-wrap">
          ${next && html`<button class="btn" style=${{ flex: "1 1 180px" }} onClick=${() => onStatus(t, next)}>Move to ${STATUS[next].label} →</button>`}
          <div style=${{ flex: "1 1 150px" }}>
            <label class="lbl" for=${"st-" + t.id} style=${{ position: "absolute", width: 1, height: 1, overflow: "hidden", clip: "rect(0 0 0 0)" }}>Set status</label>
            <select id=${"st-" + t.id} class="fld" value=${t.status} onChange=${(e) => onStatus(t, e.target.value)}>
              ${STATUSES.map((s) => html`<option key=${s} value=${s}>${STATUS[s].label}</option>`)}
            </select>
          </div>
        </div>
      </div>`}
    </div>
  </article>`;
}

function NewTicket({ be, user, defaultModule, nextNo, onClose, onSaved }) {
  const [f, setF] = useState({ module: defaultModule, type: MODULES[defaultModule].types[0], title: "", description: "", address: "", priority: "normal" });
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  function pickModule(m) { setF((p) => ({ ...p, module: m, type: MODULES[m].types[0] })); }
  function pickFile(e) {
    const x = e.target.files && e.target.files[0];
    if (preview) URL.revokeObjectURL(preview);
    setFile(x || null); setPreview(x ? URL.createObjectURL(x) : null);
  }
  async function submit(e) {
    e.preventDefault(); setBusy(true); setErr("");
    try {
      await be.create({ module: f.module, type: f.type, title: f.title.trim(), description: f.description.trim(), address: f.address.trim(), priority: f.priority, status: "new" }, file, user, nextNo);
      onSaved(f.module);
    } catch (x) { setErr(errText(x)); setBusy(false); }
  }
  return html`<div class="sheet" role="dialog" aria-modal="true" aria-label="New ticket">
    <form class="wrap flex flex-col gap-4" style=${{ paddingBlock: "16px 32px" }} onSubmit=${submit}>
      <div class="flex items-center justify-between">
        <div class="disp" style=${{ fontSize: 30 }}>New ticket</div>
        <button type="button" class="btn ghost" style=${{ minHeight: 44 }} onClick=${onClose}>Cancel</button>
      </div>
      <div><label class="lbl" for="f-module">Module</label>
        <select id="f-module" class="fld" value=${f.module} onChange=${(e) => pickModule(e.target.value)}>
          ${Object.entries(MODULES).map(([k, m]) => html`<option key=${k} value=${k}>${m.label}</option>`)}
        </select></div>
      <div><label class="lbl" for="f-type">Type</label>
        <select id="f-type" class="fld" value=${f.type} onChange=${(e) => set("type", e.target.value)}>
          ${MODULES[f.module].types.map((t) => html`<option key=${t} value=${t}>${t}</option>`)}
        </select></div>
      <div><label class="lbl" for="f-title">Title</label>
        <input id="f-title" class="fld" required maxlength="120" placeholder="Short summary, e.g. Collect 3 bales PET" value=${f.title} onInput=${(e) => set("title", e.target.value)} /></div>
      <div><label class="lbl" for="f-desc">Description</label>
        <textarea id="f-desc" class="fld" placeholder="Material, weight, contact person, gate or access notes" value=${f.description} onInput=${(e) => set("description", e.target.value)}></textarea></div>
      <div><label class="lbl" for="f-addr">Address</label>
        <input id="f-addr" class="fld" autocomplete="street-address" placeholder="Pickup address or yard location" value=${f.address} onInput=${(e) => set("address", e.target.value)} /></div>
      <div><label class="lbl" for="f-pri">Priority</label>
        <select id="f-pri" class="fld" value=${f.priority} onChange=${(e) => set("priority", e.target.value)}>
          ${PRIORITIES.map((p) => html`<option key=${p} value=${p}>${PRIORITY[p].label}</option>`)}
        </select></div>
      <div><label class="lbl" for="f-photo">Photo</label>
        <input id="f-photo" class="fld" type="file" accept="image/*" onChange=${pickFile} style=${{ paddingBlock: 9 }} />
        ${preview && html`<img src=${preview} alt="Selected photo preview" style=${{ marginTop: 10, maxHeight: 220, borderRadius: 6, border: "1px solid var(--line)" }} />`}</div>
      ${err && html`<div class="err">${err}</div>`}
      <button class="btn" disabled=${busy || !f.title.trim()}>${busy ? "Saving…" : "Create ticket"}</button>
    </form>
  </div>`;
}

function App() {
  const [be, setBe] = useState(null);
  const [user, setUser] = useState(undefined); // undefined = loading, null = signed out
  const [tickets, setTickets] = useState(null);
  const [err, setErr] = useState("");
  const [tab, setTab] = useState(LS.get("yt-tab", "ordering"));
  const [filter, setFilter] = useState(LS.get("yt-filter", "active"));
  const [openId, setOpenId] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const feed = useRef(null);

  useEffect(() => {
    let off = () => {};
    makeBackend().then(async (b) => {
      setBe(b);
      if (b.mode === "none") return;
      off = b.onAuth((u) => setUser(u));
      try { setUser(await b.init()); } catch (e) { setUser(null); setErr(errText(e)); }
    });
    return () => off();
  }, []);

  const uid = user && user.id;
  useEffect(() => {
    if (!be || !uid) { setTickets(null); return; }
    feed.current = be.subscribe(setTickets, (e) => setErr(errText(e)));
    return () => feed.current && feed.current.stop();
  }, [be, uid]);

  useEffect(() => LS.set("yt-tab", tab), [tab]);
  useEffect(() => LS.set("yt-filter", filter), [filter]);

  const nextNo = useMemo(() => Math.max(0, ...(tickets || []).map((t) => t.ticket_number || 0)) + 1, [tickets]);
  const counts = useMemo(() => {
    const c = { ordering: 0, maintenance: 0, internal: 0 };
    (tickets || []).forEach((t) => { if (t.status !== "done" && t.status !== "closed" && c[t.module] != null) c[t.module]++; });
    return c;
  }, [tickets]);
  const list = useMemo(() => {
    const ok = (t) => (filter === "all" ? true : filter === "active" ? t.status !== "done" && t.status !== "closed" : t.status === filter);
    return (tickets || []).filter((t) => t.module === tab && ok(t)).sort((a, b) => {
      const ca = a.status === "closed" ? 1 : 0, cb = b.status === "closed" ? 1 : 0;
      if (ca !== cb) return ca - cb;
      const pa = (PRIORITY[a.priority] || PRIORITY.normal).w, pb = (PRIORITY[b.priority] || PRIORITY.normal).w;
      if (pa !== pb) return pb - pa;
      return new Date(b.created_at) - new Date(a.created_at);
    });
  }, [tickets, tab, filter]);

  async function changeStatus(t, status) {
    if (status === t.status) return;
    setErr("");
    setTickets((p) => p.map((x) => (x.id === t.id ? { ...x, status } : x)));
    try { await be.setStatus(t.id, status); feed.current && feed.current.refresh(); }
    catch (e) { setErr("Status not saved: " + errText(e)); feed.current && feed.current.refresh(); }
  }

  if (!be || user === undefined) return html`<div class="wrap" style=${{ paddingBlock: 48, color: "var(--muted)" }}>Loading…</div>`;
  if (be.mode === "none") return html`<div class="wrap" style=${{ paddingBlock: 48 }}>
    <div class="disp" style=${{ fontSize: 32 }}>Yard Tickets</div>
    <p>${be.reason || "This page needs a signed-in Claude viewer to use its data store. Sign in to claude.ai and reopen the link."}</p></div>`;
  if (!user) return html`<${Login} be=${be} />`;

  return html`<div>
    <header class="hdr">
      <div class="wrap">
        <div class="flex items-center justify-between gap-3" style=${{ paddingBlock: 10 }}>
          <div style=${{ minWidth: 0 }}>
            <div class="disp" style=${{ fontSize: 28, lineHeight: 1 }}>Yard Tickets</div>
            <div style=${{ fontSize: 12, color: "var(--muted)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>${be.label} · ${user.name}</div>
          </div>
          ${be.canSignOut && html`<button class="btn ghost" style=${{ minHeight: 40, padding: "0 12px", fontSize: 14 }} onClick=${() => be.signOut()}>Sign out</button>`}
        </div>
        <div role="tablist" class="flex">
          ${Object.entries(MODULES).map(([k, m]) => html`<button key=${k} role="tab" class="tab" aria-selected=${tab === k} onClick=${() => { setTab(k); setOpenId(null); }}>${m.short}<span class="n mono">${counts[k]}</span></button>`)}
        </div>
      </div>
    </header>
    <main class="wrap" style=${{ paddingBottom: 110 }}>
      <div class="scroll-x" role="group" aria-label="Filter by status">
        ${FILTERS.map(([k, l]) => html`<button key=${k} class="chip" aria-pressed=${filter === k} onClick=${() => setFilter(k)}>${l}</button>`)}
      </div>
      ${err && html`<div class="err" style=${{ marginBottom: 12 }}>${err}${/relation|column|schema cache|does not exist/i.test(err) ? " — run the setup SQL in your Supabase SQL editor." : ""}</div>`}
      ${tickets === null
        ? html`<p style=${{ color: "var(--muted)" }}>Loading tickets…</p>`
        : list.length === 0
          ? html`<div style=${{ border: "1px dashed var(--line)", borderRadius: 6, padding: "28px 18px", textAlign: "center", color: "var(--muted)" }}>
              <div class="disp" style=${{ fontSize: 22, color: "var(--ink)" }}>No ${filter === "all" ? "" : (FILTERS.find((x) => x[0] === filter) || [])[1] + " "}tickets in ${MODULES[tab].label}</div>
              <p style=${{ margin: "6px 0 0" }}>Tap New ticket to log one.</p></div>`
          : html`<div class="flex flex-col gap-3">${list.map((t) => html`<${Ticket} key=${t.id} t=${t} be=${be} open=${openId === t.id} onToggle=${() => setOpenId(openId === t.id ? null : t.id)} onStatus=${changeStatus} />`)}</div>`}
    </main>
    <div class="bar"><div class="wrap" style=${{ padding: 0 }}>
      <button class="btn" style=${{ width: "100%" }} onClick=${() => setShowNew(true)}>+ New ticket</button>
    </div></div>
    ${showNew && html`<${NewTicket} be=${be} user=${user} defaultModule=${tab} nextNo=${nextNo} onClose=${() => setShowNew(false)} onSaved=${(m) => { setShowNew(false); setTab(m); setFilter("active"); feed.current && feed.current.refresh(); }} />`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>

</body></html>
