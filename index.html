<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tickets - Yard Part 1 Inbound</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{font-family: Inter, system-ui, sans-serif}</style>
</head>
<body class="bg-slate-50 min-h-screen">
<header class="bg-slate-900 text-white p-4 sticky top-0 z-20">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="font-bold text-lg">♻️ Tickets <span class="text-xs bg-green-600 px-2 py-1 rounded ml-2">YARD P1 LIVE</span></h1>
    <div class="flex gap-2 text-xs">
      <span id="onlineStatus" class="px-2 py-1 rounded bg-green-500">Online</span>
      <span id="offlineCount" class="px-2 py-1 rounded bg-amber-500 hidden">0 queued</span>
      <button id="syncBtn" class="px-2 py-1 rounded bg-white text-slate-900 hidden">Sync Now</button>
    </div>
  </div>
</header>

<div class="max-w-6xl mx-auto p-4">
  <!-- Tabs -->
  <div class="flex gap-2 mb-6 overflow-x-auto">
    <button data-tab="ordering" class="tab-btn px-4 py-2 rounded bg-white border">Ordering</button>
    <button data-tab="maintenance" class="tab-btn px-4 py-2 rounded bg-white border">Maintenance</button>
    <button data-tab="internal" class="tab-btn px-4 py-2 rounded bg-white border">Internal</button>
    <button data-tab="yard" class="tab-btn px-4 py-2 rounded bg-slate-900 text-white">YARD</button>
  </div>

  <!-- Ordering/Maint/Internal placeholder -->
  <div id="tab-ordering" class="tab-panel hidden"><div class="bg-white p-6 rounded shadow">Ordering module - existing tickets work as before</div></div>
  <div id="tab-maintenance" class="tab-panel hidden"><div class="bg-white p-6 rounded shadow">Maintenance module</div></div>
  <div id="tab-internal" class="tab-panel hidden"><div class="bg-white p-6 rounded shadow">Internal module</div></div>

  <!-- YARD TAB -->
  <div id="tab-yard" class="tab-panel">
    <div class="flex gap-2 mb-4">
      <button class="px-3 py-1.5 bg-slate-900 text-white rounded text-sm">1. Inbound</button>
      <button disabled class="px-3 py-1.5 bg-white border rounded text-sm opacity-40">2. Sorting (next)</button>
      <button disabled class="px-3 py-1.5 bg-white border rounded text-sm opacity-40">3. Refining</button>
      <button disabled class="px-3 py-1.5 bg-white border rounded text-sm opacity-40">4. Storage</button>
      <button disabled class="px-3 py-1.5 bg-white border rounded text-sm opacity-40">5. Outbound</button>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <!-- Form -->
      <div class="bg-white rounded-xl shadow p-5">
        <h2 class="font-bold text-lg mb-1">Yard Inbound - YB-IN-xxx</h2>
        <p class="text-xs text-slate-500 mb-4">Receiver only • 3 scales only • Photo required</p>
        
        <form id="inboundForm" class="space-y-4">
          <div>
            <label class="text-sm font-medium">Scale *</label>
            <select id="scale_id" required class="w-full mt-1 border rounded p-2.5">
              <option value="">Select scale</option>
              <option value="SCALE-1">SCALE-1</option>
              <option value="SCALE-2">SCALE-2</option>
              <option value="SCALE-3">SCALE-3</option>
            </select>
          </div>

          <div>
            <label class="text-sm font-medium">Weight (kg) *</label>
            <input id="weight_kg" type="number" step="0.01" required placeholder="e.g. 245.50" class="w-full mt-1 border rounded p-2.5">
          </div>

          <div>
            <label class="text-sm font-medium">Scale QR / Ticket QR</label>
            <div class="flex gap-2 mt-1">
              <input id="scale_qr" type="text" placeholder="Scan or type QR" class="flex-1 border rounded p-2.5">
              <button type="button" id="qrBtn" class="px-3 py-2 bg-slate-900 text-white rounded text-sm">📷 Scan</button>
            </div>
            <div id="qrReader" class="mt-2 hidden"></div>
          </div>

          <div>
            <label class="text-sm font-medium">Scale Photo * (proof)</label>
            <input id="photo" type="file" accept="image/*" capture="environment" required class="w-full mt-1 border rounded p-2">
            <img id="photoPreview" class="mt-2 rounded hidden max-h-48 w-full object-cover">
          </div>

          <button type="submit" class="w-full bg-green-600 text-white py-3 rounded font-bold">SAVE YB-IN Ticket</button>
          <p class="text-xs text-slate-400 text-center">If offline, it will queue and auto-sync later</p>
        </form>
      </div>

      <!-- List -->
      <div class="bg-white rounded-xl shadow p-5">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold">Recent Inbounds</h3>
          <button id="refreshBtn" class="text-xs px-2 py-1 border rounded">Refresh</button>
        </div>
        <div id="inboundList" class="space-y-2 max-h-[600px] overflow-auto"></div>
      </div>
    </div>
  </div>
</div>

<script>
// === CONFIG - PASTE YOUR SUPABASE KEYS IF NEEDED ===
const SUPABASE_URL = 'https://odthhfckgkozetzcbglg.supabase.co'; // replace if different
const SUPABASE_ANON = 'sb_publishable_rmo6F4vWE0fJARhrElXshw_mRCjRzch'; // placeholder - uses your existing project's anon key from previous setup, replace with real one
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// Tab switching
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(x=>x.className='tab-btn px-4 py-2 rounded bg-white border');
    b.className='tab-btn px-4 py-2 rounded bg-slate-900 text-white';
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.add('hidden'));
    document.getElementById('tab-'+b.dataset.tab).classList.remove('hidden');
  })
});

// Online/offline
const offlineKey = 'yard_offline_queue';
function getQueue(){ try{ return JSON.parse(localStorage.getItem(offlineKey)||'[]')}catch{return []}}
function setQueue(q){ localStorage.setItem(offlineKey, JSON.stringify(q)); updateOfflineUI();}
function updateOfflineUI(){
  const q=getQueue();
  const el=document.getElementById('offlineCount');
  const sync=document.getElementById('syncBtn');
  if(q.length>0){ el.textContent=q.length+' queued'; el.classList.remove('hidden'); sync.classList.remove('hidden'); }
  else { el.classList.add('hidden'); sync.classList.add('hidden'); }
}
function updateOnline(){
  const online=navigator.onLine;
  document.getElementById('onlineStatus').textContent=online?'Online':'Offline';
  document.getElementById('onlineStatus').className='px-2 py-1 rounded text-xs '+(online?'bg-green-500':'bg-red-500');
  if(online) syncQueue();
}
window.addEventListener('online', updateOnline);
window.addEventListener('offline', updateOnline);
updateOnline(); updateOfflineUI();

// Photo preview
document.getElementById('photo').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const img=document.getElementById('photoPreview');
  img.src=URL.createObjectURL(f); img.classList.remove('hidden');
});

// QR Scanner
let html5Qr;
document.getElementById('qrBtn').addEventListener('click', async ()=>{
  const reader=document.getElementById('qrReader');
  reader.classList.toggle('hidden');
  if(reader.classList.contains('hidden')){ if(html5Qr){ await html5Qr.stop(); } return; }
  html5Qr = new Html5Qrcode("qrReader");
  try{
    await html5Qr.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
      (decoded)=>{
        document.getElementById('scale_qr').value=decoded;
        html5Qr.stop(); reader.classList.add('hidden');
      }, ()=>{}
    );
  }catch(err){ alert('Camera error: '+err); }
});

// Save
document.getElementById('inboundForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const payload = {
    scale_id: document.getElementById('scale_id').value,
    weight_kg: parseFloat(document.getElementById('weight_kg').value),
    scale_qr: document.getElementById('scale_qr').value || null,
    _photoFile: document.getElementById('photo').files[0]
  };
  if(!payload._photoFile){ alert('Scale photo required'); return; }

  if(!navigator.onLine){
    const q=getQueue(); q.push({ ...payload, _photoName: payload._photoFile.name, localId: Date.now(), _photoBase64: await fileToBase64(payload._photoFile) });
    setQueue(q); alert('Offline - queued. Will sync when online.'); e.target.reset(); document.getElementById('photoPreview').classList.add('hidden'); loadList();
    return;
  }
  await saveInbound(payload);
  e.target.reset(); document.getElementById('photoPreview').classList.add('hidden');
});

async function fileToBase64(file){
  return new Promise(res=>{
    const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file);
  });
}
function base64ToFile(b64, name){
  const arr=b64.split(','), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]);
  let n=bstr.length, u8=new Uint8Array(n); while(n--) u8[n]=bstr.charCodeAt(n);
  return new File([u8], name, {type:mime});
}

async function saveInbound(data){
  try{
    // upload photo
    let photoFile = data._photoFile || (data._photoBase64 ? base64ToFile(data._photoBase64, data._photoName||'scale.jpg') : null);
    let photoUrl = null;
    if(photoFile){
      const fileName = Date.now()+'_'+photoFile.name;
      const { error: upErr } = await supabase.storage.from('yard-photos').upload(fileName, photoFile);
      if(upErr) throw upErr;
      const { data: pub } = supabase.storage.from('yard-photos').getPublicUrl(fileName);
      photoUrl = pub.publicUrl;
    }
    const { data: inserted, error } = await supabase.from('yard_inbound').insert({
      scale_id: data.scale_id,
      weight_kg: data.weight_kg,
      scale_qr: data.scale_qr,
      photo_url: photoUrl
    }).select().single();
    if(error) throw error;
    alert('Saved '+inserted.ticket_no);
    loadList();
  }catch(err){
    console.error(err);
    alert('Save failed: '+err.message+' - queued offline');
    const q=getQueue(); q.push(data); setQueue(q);
  }
}

async function syncQueue(){
  const q=getQueue(); if(q.length===0) return;
  document.getElementById('syncBtn').textContent='Syncing '+q.length+'...';
  const remaining=[];
  for(const item of q){
    try{ await saveInbound(item); } catch{ remaining.push(item); }
  }
  setQueue(remaining);
  document.getElementById('syncBtn').textContent='Sync Now';
  loadList();
}
document.getElementById('syncBtn').addEventListener('click', syncQueue);

async function loadList(){
  const { data } = await supabase.from('yard_inbound').select('*').order('created_at',{ascending:false}).limit(20);
  const list=document.getElementById('inboundList');
  if(!data || data.length===0){ list.innerHTML='<p class="text-xs text-slate-400">No tickets yet</p>'; return; }
  list.innerHTML=data.map(r=>`
    <div class="border rounded p-3 text-sm">
      <div class="flex justify-between"><span class="font-bold">${r.ticket_no}</span><span class="text-xs bg-slate-100 px-2 py-0.5 rounded">${r.scale_id}</span></div>
      <div class="text-xs text-slate-600 mt-1">${r.weight_kg} kg • QR: ${r.scale_qr||'-'} • ${new Date(r.created_at).toLocaleString()}</div>
      ${r.photo_url?`<img src="${r.photo_url}" class="mt-2 rounded max-h-32 w-full object-cover">`:''}
    </div>
  `).join('');
}
document.getElementById('refreshBtn').addEventListener('click', loadList);
loadList();
</script>
</body>
</html>
